# StyLua formatter config — mirrors the existing codebase style
# (tabs, double quotes). https://github.com/JohnnyMorganz/StyLua
column_width = 100
line_endings = "Unix"
indent_type = "Tabs"
indent_width = 4
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "Never"
